<!DOCTYPE html>
<html lang="es">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover">
<title>Control remoto · Photobooth</title>
<style>
  *{margin:0;padding:0;box-sizing:border-box}
  html,body{height:100%}
  body{font-family:-apple-system,"Segoe UI",Roboto,sans-serif;color:#fdf6e3;
    background:radial-gradient(120% 90% at 50% 0%,#4a0e22 0%,#2a0714 52%,#160409 100%);
    display:flex;flex-direction:column;align-items:center;padding:26px 20px calc(22px + env(safe-area-inset-bottom));
    -webkit-user-select:none;user-select:none;-webkit-tap-highlight-color:transparent}
  .brand{font-size:15px;letter-spacing:4px;color:#d8a441;font-weight:800;text-align:center}
  h1{font-size:24px;font-weight:900;margin:8px 0 4px;text-align:center}
  .sub{font-size:14.5px;opacity:.8;text-align:center;line-height:1.45}
  #status{margin:20px 0 6px;font-size:16px;font-weight:700;padding:10px 18px;border-radius:999px;
    background:rgba(255,255,255,.1);border:1px solid rgba(255,255,255,.25);text-align:center}
  #status.ok{background:rgba(46,125,50,.35);border-color:rgba(129,199,132,.7);color:#d9f2d9}
  #status.bad{background:rgba(150,30,30,.35);border-color:rgba(239,154,154,.6);color:#ffd9d9}
  .code-row{display:flex;gap:10px;margin-top:14px}
  .code-row input{width:150px;font-size:20px;font-weight:800;text-align:center;letter-spacing:3px;
    padding:12px;border-radius:14px;border:1.5px solid rgba(216,164,65,.6);background:rgba(0,0,0,.35);color:#fff}
  .btn{font-family:inherit;font-weight:800;cursor:pointer;border-radius:999px;border:1px solid rgba(255,255,255,.3);
    background:rgba(255,255,255,.12);color:#fff;font-size:16px;padding:13px 22px}
  .btn:active{transform:scale(.97)}
  #btn-shoot{margin-top:34px;width:210px;height:210px;border-radius:50%;border:none;cursor:pointer;
    background:radial-gradient(circle at 50% 32%,#ffe9a8,#f6c453 55%,#c8892a);
    color:#3a1503;font-family:inherit;font-weight:900;font-size:27px;line-height:1.15;
    box-shadow:0 18px 50px rgba(0,0,0,.55),inset 0 -8px 18px rgba(120,60,0,.35);
    display:flex;flex-direction:column;align-items:center;justify-content:center;gap:4px}
  #btn-shoot:disabled{filter:grayscale(.7) brightness(.6);cursor:default}
  #btn-shoot:active:not(:disabled){transform:scale(.96)}
  #btn-shoot .cam{font-size:52px}
  .row{display:flex;gap:10px;margin-top:30px;flex-wrap:wrap;justify-content:center}
  .row .btn.sel{background:linear-gradient(180deg,#f6c453,#d8a441);color:#3a1503;border:none}
  .hint{margin-top:auto;padding-top:26px;font-size:13px;opacity:.65;text-align:center;line-height:1.5;max-width:340px}
</style>
</head>
<body>
  <div class="brand">ALALUNA AI</div>
  <h1>📸 Control remoto</h1>
  <p class="sub">Dispara la foto del photobooth desde tu celular,<br>mientras tus invitados se ven en el iPad.</p>

  <div id="status">Conectando…</div>

  <div class="code-row" id="code-row" style="display:none">
    <input id="code-in" inputmode="numeric" maxlength="6" placeholder="Código">
    <button class="btn" id="btn-connect">Conectar</button>
  </div>

  <button id="btn-shoot" disabled><span class="cam">📷</span>¡FOTO!</button>

  <div class="row">
    <button class="btn sel" id="btn-m1">Marco 1</button>
    <button class="btn" id="btn-m2">Marco 2</button>
  </div>

  <p class="hint">El código aparece en la esquina superior izquierda de la pantalla de la cámara del iPad (toca el chip 📱 para ver el QR).</p>

<script src="mq-1.js"></script>
<script>
function b64ToBytes(b64){
  const bin = atob(b64), bytes = new Uint8Array(bin.length);
  for (let i = 0; i < bin.length; i++) bytes[i] = bin.charCodeAt(i);
  return bytes;
}
function injectLib(b64){
  return new Promise((res, rej) => {
    const url = URL.createObjectURL(new Blob([b64ToBytes(b64)], { type: "text/javascript" }));
    const s = document.createElement("script");
    s.src = url; s.onload = res; s.onerror = rej;
    document.head.appendChild(s);
  });
}
const $ = (id) => document.getElementById(id);
const qs = new URLSearchParams(location.search);
const MQTT_BROKERS = [
  { host: "broker.emqx.io", port: 8084, path: "/mqtt", ssl: true },
  { host: "test.mosquitto.org", port: 8081, path: "/mqtt", ssl: true }
];
let clients = [], cmdTopic = "", statusTopic = "", boothSeen = false;

function setStatus(txt, cls){ const s = $("status"); s.textContent = txt; s.className = cls || ""; }

function sendCmd(cmd){
  let sent = false;
  clients.forEach((c) => {
    try {
      if (c.isConnected()){
        const m = new Paho.Message(cmd);
        m.destinationName = cmdTopic;
        c.send(m); sent = true;
      }
    } catch(e){}
  });
  return sent;
}

function connect(code){
  if (!code || code.length < 4){ setStatus("Escribe el código del iPad", "bad"); return; }
  cmdTopic = "alaluna/photobooth/" + code + "/cmd";
  statusTopic = "alaluna/photobooth/" + code + "/status";
  boothSeen = false; clients = [];
  $("btn-shoot").disabled = true;
  setStatus("Buscando tu cabina… (código " + code + ")");
  let brokers = MQTT_BROKERS;
  if (qs.get("mqttsrv")){
    const parts = qs.get("mqttsrv").split(":");
    brokers = [{ host: parts[0], port: Number(parts[1]) || 9002, path: "/" + (parts[2] || "mqtt"), ssl: false }];
  }
  brokers.forEach((b, bi) => {
    const cid = "pb-phone-" + code + "-" + bi + "-" + Math.random().toString(36).slice(2, 10);
    const client = new Paho.Client(b.host, b.port, b.path, cid);
    const tryConnect = () => {
      try {
        client.connect({
          useSSL: b.ssl, timeout: 8, keepAliveInterval: 30,
          onSuccess: () => { clients.push(client); client.subscribe(statusTopic); },
          onFailure: () => setTimeout(tryConnect, 5000)
        });
      } catch(e){ setTimeout(tryConnect, 5000); }
    };
    client.onConnectionLost = () => setTimeout(tryConnect, 3000);
    client.onMessageArrived = (msg) => {
      if (msg.destinationName === statusTopic && msg.payloadString === "online" && !boothSeen){
        boothSeen = true;
        setStatus("✅ Conectado a la cabina", "ok");
        $("btn-shoot").disabled = false;
        $("code-row").style.display = "none";
      }
    };
    tryConnect();
  });
  setTimeout(() => {
    if (!boothSeen) setStatus("Aún buscando la cabina… verifica que el iPad tenga la app abierta y con internet", "");
  }, 9000);
}

(async function init(){
  try {
    await injectLib(window.__PAHO);
    const code = qs.get("c");
    if (code) connect(code);
    else { $("code-row").style.display = "flex"; setStatus("Escribe el código que muestra el iPad"); }
  } catch(e){ setStatus("No se pudo cargar el control", "bad"); }
})();

$("btn-connect").addEventListener("click", () => connect($("code-in").value.trim()));
$("btn-shoot").addEventListener("click", () => {
  if (sendCmd("shoot")){ if (navigator.vibrate) navigator.vibrate(40); }
});
$("btn-m1").addEventListener("click", () => { sendCmd("mode1"); $("btn-m1").classList.add("sel"); $("btn-m2").classList.remove("sel"); });
$("btn-m2").addEventListener("click", () => { sendCmd("mode2"); $("btn-m2").classList.add("sel"); $("btn-m1").classList.remove("sel"); });
</script>
</body>
</html>
