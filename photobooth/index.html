<!DOCTYPE html>
<html lang="es">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0, maximum-scale=1.0, user-scalable=no, viewport-fit=cover">
<meta name="apple-mobile-web-app-capable" content="yes">
<meta name="apple-mobile-web-app-status-bar-style" content="black-translucent">
<title>Photobooth · Salsa y Salud 2026</title>
<style>
  :root{ --gold:#f6c453; --gold2:#e8a020; --wine:#7a1030; --wine2:#a31621; --cream:#fff7e8; }
  *{margin:0;padding:0;box-sizing:border-box;-webkit-tap-highlight-color:transparent}
  html,body{height:100%;overflow:hidden;background:#160409}
  body{font-family:"Arial Rounded MT Bold","Helvetica Neue",Arial,sans-serif;color:var(--cream);
       -webkit-user-select:none;user-select:none;touch-action:manipulation}
  .screen{position:fixed;inset:0;display:none;flex-direction:column}
  .screen.on{display:flex}

  /* ---------- Intro: cinta animada Alaluna AI Solutions ---------- */
  #scr-intro{background:radial-gradient(110% 90% at 50% 30%, #2b0714 0%, #160409 70%);
             align-items:center;justify-content:center;overflow:hidden;cursor:pointer;z-index:20}
  #scr-intro .presenta{font-size:clamp(13px,2.2vw,17px);letter-spacing:6px;color:rgba(255,247,232,.75);
    margin-bottom:26px;font-weight:700}
  .tape{width:130%;transform:rotate(-2.5deg);overflow:hidden;flex:none;
    background:linear-gradient(180deg,#ffd970,var(--gold) 45%,var(--gold2));
    box-shadow:0 18px 50px rgba(0,0,0,.55), inset 0 2px 0 rgba(255,255,255,.65), inset 0 -3px 0 rgba(0,0,0,.18);
    padding:16px 0}
  .tape-track{display:flex;width:max-content;animation:tapeMove 16s linear infinite}
  .tape-track span{font-weight:900;font-size:clamp(26px,5.4vw,44px);letter-spacing:2px;color:#2a1503;
    white-space:nowrap;padding-right:.6em}
  @keyframes tapeMove{from{transform:translateX(0)}to{transform:translateX(-50%)}}
  .tape2{width:130%;transform:rotate(-2.5deg);overflow:hidden;flex:none;margin-top:14px;
    background:rgba(255,255,255,.06);border-top:1px solid rgba(246,196,83,.5);border-bottom:1px solid rgba(246,196,83,.5);
    padding:8px 0}
  .tape2 .tape-track{animation:tapeMove2 22s linear infinite}
  .tape2 span{font-weight:800;font-size:clamp(13px,2.4vw,19px);letter-spacing:5px;color:var(--gold)}
  @keyframes tapeMove2{from{transform:translateX(-50%)}to{transform:translateX(0)}}
  #scr-intro .skip{position:absolute;bottom:22px;left:0;right:0;text-align:center;font-size:13px;
    letter-spacing:2px;color:rgba(255,247,232,.5)}
  #scr-intro{transition:opacity .6s ease}
  #scr-intro.bye{opacity:0;pointer-events:none}

  /* ---------- Bienvenida ---------- */
  #scr-start{background:radial-gradient(120% 90% at 50% 0%, #b81f3a 0%, var(--wine2) 38%, var(--wine) 68%, #4a0a1e 100%);
             align-items:center;justify-content:center;text-align:center;padding:24px;overflow:hidden}
  .notes-float{position:absolute;inset:0;pointer-events:none;opacity:.5}
  .badge{display:inline-block;background:rgba(0,0,0,.28);border:2px solid var(--gold);color:var(--gold);
         padding:8px 22px;border-radius:999px;font-size:clamp(14px,2.4vw,20px);letter-spacing:3px;margin-bottom:18px}
  #scr-start h1{font-size:clamp(44px,10vw,96px);line-height:1.02;font-weight:900;color:#fff;
    text-shadow:0 4px 0 rgba(0,0,0,.25), 0 14px 44px rgba(0,0,0,.5)}
  #scr-start h1 .gold{color:var(--gold)}
  #scr-start p{margin-top:16px;font-size:clamp(17px,3vw,24px);opacity:.95;max-width:560px}
  .btn-big{margin-top:38px;background:linear-gradient(180deg,var(--gold),var(--gold2));color:#3a1503;border:none;
    font-family:inherit;font-weight:900;font-size:clamp(22px,4.4vw,32px);letter-spacing:1px;
    padding:20px 46px;border-radius:999px;box-shadow:0 14px 40px rgba(0,0,0,.45), inset 0 2px 0 rgba(255,255,255,.6);
    cursor:pointer;animation:pulse 1.6s ease-in-out infinite}
  .btn-big:disabled{opacity:.5;animation:none}
  @keyframes pulse{0%,100%{transform:scale(1)}50%{transform:scale(1.045)}}
  .foot-hint{position:absolute;bottom:18px;left:0;right:0;font-size:13px;opacity:.65;letter-spacing:1px}

  /* ---------- Cámara ---------- */
  #scr-cam{background:#0d0207}
  #stage-zone{flex:1;display:flex;align-items:center;justify-content:center;padding:10px;min-height:0}
  #stage{position:relative;aspect-ratio:2/3;background:#fff;border-radius:6px;overflow:hidden;
         max-width:100%;max-height:100%;box-shadow:0 24px 70px rgba(0,0,0,.65)}
  /* El alto manda si la pantalla es baja: se ajusta por JS */
  #vid{position:absolute;object-fit:cover;transform:scaleX(-1);background:#ddd;transition:left .35s ease,top .35s ease,width .35s ease,height .35s ease}
  #frame-img{position:absolute;inset:0;width:100%;height:100%;pointer-events:none}
  #count{position:absolute;inset:0;display:none;align-items:center;justify-content:center;pointer-events:none;z-index:5}
  #count span{font-size:clamp(110px,30vw,230px);font-weight:900;color:#fff;text-shadow:0 10px 60px rgba(0,0,0,.85)}
  #flash{position:absolute;inset:0;background:#fff;opacity:0;pointer-events:none;z-index:6}
  #shotmsg{position:absolute;top:9%;left:0;right:0;text-align:center;font-size:clamp(21px,4.6vw,34px);font-weight:900;
    color:#fff;text-shadow:0 3px 16px rgba(0,0,0,.85);display:none;z-index:5}
  #bar{display:flex;gap:12px;align-items:center;justify-content:space-between;padding:14px 16px calc(14px + env(safe-area-inset-bottom));
    background:linear-gradient(180deg,#2a0714,#1a040c)}
  .modes{display:flex;background:rgba(255,255,255,.1);border-radius:999px;padding:4px;gap:4px}
  .modes button{border:none;background:transparent;color:#fff;font-family:inherit;font-weight:800;font-size:16px;
    padding:10px 18px;border-radius:999px;cursor:pointer;opacity:.75}
  .modes button.sel{background:var(--gold);color:#3a1503;opacity:1}
  #btn-shot{background:linear-gradient(180deg,var(--gold),var(--gold2));color:#3a1503;border:none;font-family:inherit;
    font-weight:900;font-size:21px;padding:16px 34px;border-radius:999px;box-shadow:0 10px 30px rgba(0,0,0,.5);cursor:pointer}
  #btn-shot:disabled{opacity:.45}
  .btn-ghost{background:rgba(255,255,255,.12);color:#fff;border:1px solid rgba(255,255,255,.25);font-family:inherit;
    font-weight:700;font-size:15px;padding:12px 18px;border-radius:999px;cursor:pointer}

  /* ---------- Resultado ---------- */
  #scr-result{background:linear-gradient(180deg,#2a0714,#160409);align-items:center;padding:20px 16px calc(18px + env(safe-area-inset-bottom));overflow:auto}
  #scr-result h2{font-size:clamp(22px,4.6vw,32px);font-weight:900;color:#fff;margin:4px 0 14px}
  #scr-result h2 b{color:var(--gold)}
  #result-img{max-height:56vh;max-width:92vw;border-radius:10px;box-shadow:0 24px 60px rgba(0,0,0,.6);border:3px solid rgba(246,196,83,.55)}
  .actions{display:flex;flex-wrap:wrap;gap:12px;justify-content:center;margin-top:20px}
  .btn-print{background:linear-gradient(180deg,var(--gold),var(--gold2));color:#3a1503;border:none;font-family:inherit;
    font-weight:900;font-size:20px;padding:16px 30px;border-radius:999px;cursor:pointer;box-shadow:0 10px 30px rgba(0,0,0,.45)}
  .btn-sec{background:rgba(255,255,255,.12);color:#fff;border:1px solid rgba(255,255,255,.3);font-family:inherit;
    font-weight:800;font-size:17px;padding:15px 24px;border-radius:999px;cursor:pointer}
  #dl-link{display:none;margin-top:14px;color:var(--gold);font-weight:700;font-size:16px}
  .counter{margin-top:16px;font-size:14px;opacity:.7;letter-spacing:1px}

  /* ---------- Impresión: solo la foto, 4×6 ---------- */
  #print-area{display:none}
  @media print{
    body>*{display:none !important}
    #print-area{display:block !important;position:fixed;inset:0}
    #print-area img{width:100%;height:100%;object-fit:cover}
    @page{size:4in 6in;margin:0}
  }
</style>
</head>
<body>

<!-- Marcos oficiales del evento, en trozos (base64) -->
<script src="f1-1.js"></script>
<script src="f1-2.js"></script>
<script src="f1-3.js"></script>
<script src="f2-1.js"></script>
<script src="f2-2.js"></script>

<!-- INTRO · ALALUNA AI SOLUTIONS -->
<section id="scr-intro" class="screen on">
  <div class="presenta">P R E S E N T A</div>
  <div class="tape"><div class="tape-track" id="tape1"></div></div>
  <div class="tape2"><div class="tape-track" id="tape2"></div></div>
  <div class="skip">TOCA PARA CONTINUAR</div>
</section>

<!-- BIENVENIDA -->
<section id="scr-start" class="screen">
  <canvas class="notes-float" id="float-canvas"></canvas>
  <div class="badge">PHOTOBOOTH</div>
  <h1>¡Salsa y <span class="gold">Salud</span> 2026!</h1>
  <p>Ponte frente a la cámara, sonríe…<br>¡y llévate tu foto impresa de recuerdo!</p>
  <button class="btn-big" id="btn-start" disabled>Cargando marcos…</button>
  <div class="foot-hint">RWJBH New Brunswick · Noviembre 21, 2026 · Photobooth por Alaluna AI Solutions</div>
</section>

<!-- CÁMARA -->
<section id="scr-cam" class="screen">
  <div id="stage-zone">
    <div id="stage">
      <video id="vid" autoplay playsinline muted></video>
      <img id="frame-img" alt="">
      <div id="shotmsg"></div>
      <div id="count"><span id="count-num">3</span></div>
      <div id="flash"></div>
    </div>
  </div>
  <div id="bar">
    <div class="modes">
      <button id="mode-1" class="sel">Marco 1</button>
      <button id="mode-2">Marco 2</button>
    </div>
    <button id="btn-shot">📸 ¡Foto!</button>
    <button class="btn-ghost" id="btn-home">Inicio</button>
  </div>
</section>

<!-- RESULTADO -->
<section id="scr-result" class="screen">
  <h2>¡Quedó <b>chévere</b>! 🎉</h2>
  <img id="result-img" alt="Tu foto">
  <div class="actions">
    <button class="btn-print" id="btn-print">🖨️ Imprimir</button>
    <button class="btn-sec" id="btn-share">📤 Compartir / Guardar</button>
    <button class="btn-sec" id="btn-again">↩ Otra foto</button>
  </div>
  <a id="dl-link" download="salsa-y-salud-2026.jpg">⬇ Descargar la foto</a>
  <div class="counter" id="counter"></div>
</section>

<div id="print-area"><img id="print-img" alt=""></div>

<script>
"use strict";
/* ============ Photobooth «Salsa y Salud 2026» — v2, marcos oficiales ============
   Marco 1: 1 foto · Marco 2: collage de 3 fotos. Compuesto 1200×1800 (4×6" · 300 dpi).
   Los marcos viajan en trozos base64 (f1-*.js / f2-*.js) y se montan en memoria:
   tras la primera carga, la app funciona sin internet (red directa de la SELPHY). */

const W = 1200, H = 1800;
const GOLD = "#f6c453";
const FRAMES = {
  marco1: { windows: [ {x:78, y:66, w:1044, h:1206} ] },
  marco2: { windows: [ {x:54, y:72, w:510, h:588},
                       {x:630, y:72, w:504, h:588},
                       {x:54, y:720, w:1086, h:588} ] }
};

const $ = id => document.getElementById(id);
const vid = $("vid"), stage = $("stage"), frameImg = $("frame-img");
let stream = null, mode = "marco1", busy = false, photoCount = 0, lastBlob = null;
const frameObjs = {};   // marco1/marco2 -> {url, img}

function b64ToUrl(b64){
  const bin = atob(b64), bytes = new Uint8Array(bin.length);
  for (let i = 0; i < bin.length; i++) bytes[i] = bin.charCodeAt(i);
  return URL.createObjectURL(new Blob([bytes], { type: "image/webp" }));
}
function loadFrame(key, b64){
  return new Promise((res, rej) => {
    const url = b64ToUrl(b64);
    const img = new Image();
    img.onload = () => { frameObjs[key] = { url, img }; res(); };
    img.onerror = rej;
    img.src = url;
  });
}
Promise.all([ loadFrame("marco1", window.__F1 || ""), loadFrame("marco2", window.__F2 || "") ])
  .then(() => {
    const b = $("btn-start");
    b.disabled = false;
    b.innerHTML = "📸 &nbsp;¡TÓMATE TU FOTO!";
    applyMode();
  })
  .catch(() => { $("btn-start").textContent = "Error cargando los marcos — recarga la página"; });

function show(id){
  document.querySelectorAll(".screen").forEach(s => s.classList.remove("on"));
  $(id).classList.add("on");
  if (id === "scr-cam") fitStage();
}

/* ---------- Intro Alaluna AI Solutions ---------- */
(function(){
  const phrase = "ALALUNA AI SOLUTIONS ✦ ";
  const half = phrase.repeat(6);
  $("tape1").innerHTML = "<span>" + half + "</span><span>" + half + "</span>";
  const phrase2 = "PHOTOBOOTH · EVENTOS · RECUERDOS ✦ ";
  const half2 = phrase2.repeat(4);
  $("tape2").innerHTML = "<span>" + half2 + "</span><span>" + half2 + "</span>";
  let gone = false;
  function dismiss(){
    if (gone) return; gone = true;
    const intro = $("scr-intro");
    intro.classList.add("bye");
    setTimeout(() => { intro.classList.remove("on"); show("scr-start"); }, 620);
  }
  setTimeout(dismiss, 3000);
  $("scr-intro").addEventListener("click", dismiss);
})();

/* El escenario (2:3) cabe siempre en su zona */
function fitStage(){
  const zone = $("stage-zone");
  const zw = zone.clientWidth - 20, zh = zone.clientHeight - 20;
  let w = zw, h = w * 1.5;
  if (h > zh){ h = zh; w = h / 1.5; }
  stage.style.width = w + "px"; stage.style.height = h + "px";
}
addEventListener("resize", fitStage);

/* Coloca el video sobre la ventana activa del marco */
function placeVideo(winIdx){
  const win = FRAMES[mode].windows[winIdx];
  vid.style.left   = (win.x / W * 100) + "%";
  vid.style.top    = (win.y / H * 100) + "%";
  vid.style.width  = (win.w / W * 100) + "%";
  vid.style.height = (win.h / H * 100) + "%";
}
function applyMode(){
  frameImg.src = frameObjs[mode] ? frameObjs[mode].url : "";
  placeVideo(0);
}

/* ---------- Notas flotantes (bienvenida) ---------- */
(function(){
  const c = $("float-canvas"), x = c.getContext("2d");
  let w, h, notes = [];
  function size(){ w = c.width = innerWidth; h = c.height = innerHeight; }
  size(); addEventListener("resize", size);
  function make(){ return { x: Math.random()*w, y: h + 40, s: 22 + Math.random()*36,
    v: .35 + Math.random()*.8, r: (Math.random()-.5)*.6, vr:(Math.random()-.5)*.01,
    ch: ["♪","♫","♩"][Math.floor(Math.random()*3)], a:.25+Math.random()*.5 }; }
  for (let i=0;i<14;i++){ const n = make(); n.y = Math.random()*h; notes.push(n); }
  (function loop(){
    x.clearRect(0,0,w,h);
    notes.forEach((n,i)=>{
      n.y -= n.v; n.r += n.vr;
      if (n.y < -60) notes[i] = make();
      x.save(); x.translate(n.x,n.y); x.rotate(n.r);
      x.globalAlpha = n.a; x.fillStyle = GOLD; x.font = n.s + "px serif";
      x.textAlign = "center"; x.fillText(n.ch,0,0); x.restore();
    });
    requestAnimationFrame(loop);
  })();
})();

/* ---------- Cámara ---------- */
async function startCamera(){
  if (stream) return;
  stream = await navigator.mediaDevices.getUserMedia({
    video: { facingMode: "user", width: { ideal: 1920 }, height: { ideal: 1440 } },
    audio: false
  });
  vid.srcObject = stream;
  await vid.play();
}
$("btn-start").addEventListener("click", async () => {
  try { await startCamera(); }
  catch(e){ alert("No se pudo abrir la cámara. Revisa el permiso de cámara para esta página."); return; }
  show("scr-cam");
});
$("btn-home").addEventListener("click", () => show("scr-start"));
$("mode-1").addEventListener("click", () => setMode("marco1"));
$("mode-2").addEventListener("click", () => setMode("marco2"));
function setMode(m){
  if (busy) return;
  mode = m;
  $("mode-1").classList.toggle("sel", m === "marco1");
  $("mode-2").classList.toggle("sel", m === "marco2");
  applyMode();
}

/* Captura un cuadro espejado, recortado al ratio de la ventana destino */
function grabFrame(rw, rh){
  const vw = vid.videoWidth, vh = vid.videoHeight;
  const target = rw / rh, src = vw / vh;
  let sw, sh, sx, sy;
  if (src > target){ sh = vh; sw = vh * target; sx = (vw - sw)/2; sy = 0; }
  else { sw = vw; sh = vw / target; sx = 0; sy = (vh - sh)/2; }
  const c = document.createElement("canvas");
  c.width = Math.round(sw); c.height = Math.round(sh);
  const x = c.getContext("2d");
  x.translate(c.width, 0); x.scale(-1, 1);
  x.drawImage(vid, sx, sy, sw, sh, 0, 0, c.width, c.height);
  return c;
}

function beep(f, t){
  try{
    const AC = window.AudioContext || window.webkitAudioContext;
    if (!AC) return;
    const ac = beep._ac || (beep._ac = new AC());
    const o = ac.createOscillator(), g = ac.createGain();
    o.frequency.value = f; o.type = "sine";
    g.gain.setValueAtTime(.12, ac.currentTime);
    g.gain.exponentialRampToValueAtTime(.001, ac.currentTime + t);
    o.connect(g); g.connect(ac.destination);
    o.start(); o.stop(ac.currentTime + t);
  }catch(e){}
}
const sleep = ms => new Promise(r => setTimeout(r, ms));

async function countdown(){
  const box = $("count"), num = $("count-num");
  box.style.display = "flex";
  for (const n of [3,2,1]){
    num.textContent = n;
    num.style.transform = "scale(1.25)"; num.style.transition = "none";
    requestAnimationFrame(()=>{ num.style.transition = "transform .45s ease"; num.style.transform = "scale(1)"; });
    beep(660, .12);
    await sleep(800);
  }
  box.style.display = "none";
  beep(990, .25);
  const f = $("flash");
  f.style.transition = "none"; f.style.opacity = .92;
  requestAnimationFrame(()=>{ f.style.transition = "opacity .35s ease"; f.style.opacity = 0; });
}
function shotMsg(txt, ms){
  const m = $("shotmsg");
  m.textContent = txt; m.style.display = txt ? "block" : "none";
  if (ms) setTimeout(()=> m.style.display = "none", ms);
}

/* Compone: fotos bajo el marco oficial */
function compose(shots){
  const c = document.createElement("canvas"); c.width = W; c.height = H;
  const x = c.getContext("2d");
  x.fillStyle = "#ffffff"; x.fillRect(0, 0, W, H);
  FRAMES[mode].windows.forEach((win, i) => {
    x.drawImage(shots[i], win.x, win.y, win.w, win.h);
  });
  x.drawImage(frameObjs[mode].img, 0, 0, W, H);
  return c;
}

/* ---------- Flujo de captura ---------- */
$("btn-shot").addEventListener("click", async () => {
  if (busy || !stream) return;
  busy = true; $("btn-shot").disabled = true;
  try {
    const wins = FRAMES[mode].windows;
    const shots = [];
    for (let i = 0; i < wins.length; i++){
      placeVideo(i);
      shotMsg(wins.length === 1 ? "¡Sonríe! 😄"
              : i === 0 ? "¡Primera foto! 😄" : i === 1 ? "¡Segunda foto! 💃" : "¡La última, la grande! 🎉", 1500);
      await sleep(250);
      await countdown();
      shots.push(grabFrame(wins[i].w, wins[i].h));
      await sleep(300);
    }
    shotMsg("");
    const canvas = compose(shots);
    lastBlob = await new Promise(r => canvas.toBlob(r, "image/jpeg", .92));
    const url = URL.createObjectURL(lastBlob);
    $("result-img").src = url;
    $("print-img").src = url;
    $("dl-link").href = url;
    $("dl-link").style.display = "inline-block";
    photoCount++;
    $("counter").textContent = "Fotos de este evento: " + photoCount;
    show("scr-result");
  } finally {
    busy = false; $("btn-shot").disabled = false;
    placeVideo(0);
  }
});

$("btn-again").addEventListener("click", () => show("scr-cam"));

$("btn-share").addEventListener("click", async () => {
  if (!lastBlob) return;
  const file = new File([lastBlob], "salsa-y-salud-2026.jpg", { type: "image/jpeg" });
  if (navigator.canShare && navigator.canShare({ files: [file] })){
    try { await navigator.share({ files: [file], title: "Salsa y Salud 2026" }); } catch(e){}
  } else if (navigator.share){
    try { await navigator.share({ title: "Salsa y Salud 2026" }); } catch(e){}
  } else {
    $("dl-link").click();
  }
});

$("btn-print").addEventListener("click", () => {
  const isIOS = /iPad|iPhone/.test(navigator.userAgent);
  if (isIOS){ $("btn-share").click(); } else { window.print(); }
});
</script>
</body>
</html>
