<!DOCTYPE html>
<html lang="es">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<title>Jarvis Panel</title>
<style>
  * { box-sizing: border-box; }
  html, body { height: 100%; }
  body {
    margin: 0; background: #000; color: #f2f2f5;
    font-family: -apple-system, BlinkMacSystemFont, "SF Pro Text", "Helvetica Neue", Arial, sans-serif;
    display: flex; flex-direction: column; align-items: center; justify-content: center;
    min-height: 100vh; padding: 24px 16px; overflow: hidden;
    -webkit-user-select: none; user-select: none;
  }
  #stateLabel {
    font-size: clamp(13px, 1.8vmin, 18px); letter-spacing: .45em; text-transform: uppercase;
    color: #a78bfa; margin-bottom: 2.2vmin; font-weight: 600; text-indent: .45em;
  }
  #ring {
    border-radius: 50%; padding: 1.4vmin;
    background: radial-gradient(circle at 50% 42%, #17171f 0%, #0a0a10 70%);
    border: 2px solid #26262f;
    box-shadow: 0 0 90px rgba(139, 109, 255, .14), 0 0 22px rgba(0,0,0,.9), inset 0 0 26px rgba(0,0,0,.85);
  }
  #stage {
    position: relative; width: min(72vmin, 880px); aspect-ratio: 1 / 1;
    border-radius: 50%; overflow: hidden; background: #000;
  }
  #stage video {
    position: absolute; inset: 0; width: 100%; height: 100%;
    object-fit: cover; border-radius: 50%;
    opacity: 0; transition: opacity .65s ease;
  }
  #stage video.on { opacity: 1; }
  #caption {
    margin-top: 3vmin; max-width: 920px; text-align: center;
    font-size: clamp(20px, 3.1vmin, 34px); line-height: 1.35; font-weight: 500;
    min-height: 2.7em; display: flex; align-items: flex-start; justify-content: center;
  }
  #controls { display: flex; gap: 12px; flex-wrap: wrap; justify-content: center; margin-top: 1.2vmin; }
  button {
    appearance: none; border: 1px solid #2c2c38; background: #121218; color: #e8e8ee;
    font-size: 16px; font-weight: 600; padding: 11px 20px; border-radius: 999px; cursor: pointer;
    transition: border-color .2s, background .2s, color .2s;
  }
  button:hover { border-color: #8b6dff; }
  button.active { background: #241b45; border-color: #8b6dff; color: #d9ccff; }
  button.voice-on { background: #3a2c07; border-color: #d4a017; color: #ffe9a8; }
  #hint { margin-top: 2.4vmin; font-size: 13px; color: #5c5c68; letter-spacing: .04em; text-align: center; }
</style>
</head>
<body>
  <div id="stateLabel">Ready</div>

  <div id="ring">
    <div id="stage">
      <video id="vidAlive" muted loop playsinline preload="auto"></video>
      <video id="vidWork" muted loop playsinline preload="auto"></video>
    </div>
  </div>

  <div id="caption">Estoy listo, Victor. Pídeme algo y me pongo los audífonos.</div>

  <div id="controls">
    <button id="btnIdle" class="active" type="button">👋 Saludo</button>
    <button id="btnWork" type="button">🎧 Trabajando</button>
    <button id="btnVoice" type="button">🔊 Activar voz</button>
  </div>

  <div id="hint">Teclas 1/2 cambian mi estado · 🔊 activa mi voz</div>

  <!-- Video data chunks (base64 -> Blob URLs, assembled below) -->
  <script src="panel-alive-1.js"></script>
  <script src="panel-alive-2.js"></script>
  <script src="panel-alive-3.js"></script>
  <script src="panel-alive-4.js"></script>
  <script src="panel-alive-5.js"></script>
  <script src="panel-alive-6.js"></script>
  <script src="panel-alive-7.js"></script>
  <script src="panel-alive-8.js"></script>
  <script src="panel-alive-9.js"></script>
  <script src="panel-alive-10.js"></script>
  <script src="panel-alive-11.js"></script>
  <script src="panel-alive-12.js"></script>
  <script src="panel-alive-13.js"></script>
  <script src="panel-work-1.js"></script>
  <script src="panel-work-2.js"></script>
  <script src="panel-work-3.js"></script>
  <script src="panel-work-4.js"></script>
  <script src="panel-work-5.js"></script>
  <script src="panel-work-6.js"></script>
  <script src="panel-work-7.js"></script>

<script>
(function () {
  var STATUS_URL = 'https://alalunavic.github.io/jarvis-status.json';
  var vidAlive = document.getElementById('vidAlive');
  var vidWork  = document.getElementById('vidWork');
  var label    = document.getElementById('stateLabel');
  var captionEl= document.getElementById('caption');
  var btnIdle  = document.getElementById('btnIdle');
  var btnWork  = document.getElementById('btnWork');
  var btnVoice = document.getElementById('btnVoice');

  function b64ToBlobUrl(parts) {
    var bin = atob(parts.join(''));
    var bytes = new Uint8Array(bin.length);
    for (var i = 0; i < bin.length; i++) bytes[i] = bin.charCodeAt(i);
    return URL.createObjectURL(new Blob([bytes], { type: 'video/mp4' }));
  }

  try {
    if (window.__JP && window.__JP.alive) vidAlive.src = b64ToBlobUrl(window.__JP.alive);
    if (window.__JP && window.__JP.work)  vidWork.src  = b64ToBlobUrl(window.__JP.work);
  } catch (e) { /* videos simply stay black if chunks failed */ }

  [vidAlive, vidWork].forEach(function (v) {
    var p = v.play(); if (p && p.catch) p.catch(function () {});
  });

  var currentState = 'idle';
  var LABELS = { idle: 'Ready', working: 'Working' };

  function showState(state) {
    if (state !== 'idle' && state !== 'working') return;
    currentState = state;
    vidAlive.classList.toggle('on', state === 'idle');
    vidWork.classList.toggle('on', state === 'working');
    label.textContent = LABELS[state];
    btnIdle.classList.toggle('active', state === 'idle');
    btnWork.classList.toggle('active', state === 'working');
    [vidAlive, vidWork].forEach(function (v) {
      var p = v.play(); if (p && p.catch) p.catch(function () {});
    });
  }

  btnIdle.addEventListener('click', function () { showState('idle'); });
  btnWork.addEventListener('click', function () { showState('working'); });
  document.addEventListener('keydown', function (e) {
    if (e.key === '1') showState('idle');
    if (e.key === '2') showState('working');
  });

  /* ---------- Voice (speechSynthesis, Spanish) ---------- */
  var voiceOn = false;
  function pickVoice() {
    if (!('speechSynthesis' in window)) return null;
    var vs = window.speechSynthesis.getVoices().filter(function (v) {
      return /^es/i.test(v.lang || '');
    });
    if (!vs.length) return null;
    return vs.find(function (v) { return /es[-_](MX|US)/i.test(v.lang); })
        || vs.find(function (v) { return /espa(n|ñ)ol|spanish/i.test(v.name); })
        || vs[0];
  }
  if ('speechSynthesis' in window) {
    window.speechSynthesis.onvoiceschanged = function () { pickVoice(); };
  }
  function speak(text) {
    if (!voiceOn || !('speechSynthesis' in window) || !text) return;
    try {
      window.speechSynthesis.cancel();
      var u = new SpeechSynthesisUtterance(text);
      var v = pickVoice();
      if (v) { u.voice = v; u.lang = v.lang; } else { u.lang = 'es-MX'; }
      u.rate = 1.0;
      window.speechSynthesis.speak(u);
    } catch (e) {}
  }
  btnVoice.addEventListener('click', function () {
    voiceOn = true;
    btnVoice.classList.add('voice-on');
    btnVoice.textContent = '🔊 Voz activada';
    speak('Voz activada.');
  });

  /* ---------- Status polling ---------- */
  var lastCaption = captionEl.textContent;
  var lastTs = null;

  function applyStatus(d) {
    if (!d) return;
    var isNewVersion = (lastTs === null) || (d.ts !== lastTs);
    if (typeof d.ts !== 'undefined') lastTs = d.ts;

    if ((d.state === 'idle' || d.state === 'working') && d.state !== currentState) {
      showState(d.state);
    }
    var capChanged = (typeof d.caption === 'string') && d.caption !== lastCaption;
    if (capChanged) {
      lastCaption = d.caption;
      captionEl.textContent = d.caption;
      if (d.speak === true) speak(d.caption);
    } else if (isNewVersion && d.speak === true && typeof d.caption === 'string') {
      speak(d.caption);
    }
  }

  function poll() {
    fetch(STATUS_URL + '?t=' + Date.now(), { cache: 'no-store' })
      .then(function (r) { return r.ok ? r.json() : null; })
      .then(applyStatus)
      .catch(function () {});
  }

  showState('idle');
  poll();
  setInterval(poll, 20000);
})();
</script>
</body>
</html>
