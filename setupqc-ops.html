<style>
:root{
  --bg:#101014; --bg2:#17171d; --card:#1d1d25; --card2:#24242e; --line:#33333f;
  --gold:#d4a437; --gold2:#f0c65e; --ink:#ece7db; --dim:#a49e8f; --dim2:#77725f;
  --ok:#43c465; --okbg:#14301c; --bad:#e5534b; --badbg:#3a1a17; --warn:#e8a33d;
  --radius:12px;
}
*{box-sizing:border-box; -webkit-tap-highlight-color:transparent}
html,body{margin:0;padding:0}
body{background:var(--bg); color:var(--ink); font-family:-apple-system,BlinkMacSystemFont,"Segoe UI",Roboto,Helvetica,Arial,sans-serif; font-size:16px; line-height:1.45; padding-bottom:40px}
a{color:var(--gold2)}
button{font-family:inherit; cursor:pointer}
header.top{position:sticky; top:0; z-index:20; background:linear-gradient(180deg,#191921,#141419); border-bottom:1px solid var(--line); padding:10px 14px 8px}
.brand{display:flex; align-items:baseline; gap:10px}
.brand h1{font-size:21px; margin:0; letter-spacing:.4px; color:var(--gold2); font-weight:800}
.brand h1 span{color:var(--ink); font-weight:300}
.brand .tag{font-size:11px; color:var(--dim); font-style:italic}
.roles{display:flex; gap:6px; margin-top:10px}
.roles button{flex:1; background:var(--card); color:var(--dim); border:1px solid var(--line); border-radius:9px; padding:9px 4px; font-size:13.5px; font-weight:600}
.roles button.on{background:var(--gold); border-color:var(--gold); color:#191408}
nav.tabs{display:flex; gap:6px; margin-top:8px}
nav.tabs button{flex:1; background:transparent; border:none; border-bottom:2px solid transparent; color:var(--dim); padding:7px 4px; font-size:14px; font-weight:600}
nav.tabs button.on{color:var(--gold2); border-bottom-color:var(--gold)}
main{padding:14px; max-width:760px; margin:0 auto}
.card{background:var(--card); border:1px solid var(--line); border-radius:var(--radius); padding:14px; margin-bottom:12px}
.card h2{margin:0 0 4px; font-size:17px; color:var(--gold2)}
.card h3{margin:0 0 6px; font-size:15px}
.sub{color:var(--dim); font-size:13px}
.btn{display:inline-block; background:var(--gold); color:#191408; border:none; border-radius:9px; padding:11px 16px; font-size:15px; font-weight:700; width:100%; text-align:center}
.btn:active{background:var(--gold2)}
.btn.ghost{background:transparent; color:var(--gold2); border:1px solid var(--gold); font-weight:600}
.btn.dark{background:var(--card2); color:var(--ink); border:1px solid var(--line); font-weight:600}
.btn.danger{background:transparent; color:var(--bad); border:1px solid var(--bad); font-weight:600}
.btn.sm{width:auto; padding:8px 13px; font-size:13.5px}
.btn:disabled{opacity:.45; cursor:not-allowed}
.row{display:flex; gap:8px}
.row>*{flex:1}
.mt{margin-top:10px}.mb{margin-bottom:10px}
label.fl{display:block; font-size:13px; color:var(--dim); margin:12px 0 4px; font-weight:600}
input[type=text],input[type=number],select,textarea{width:100%; background:var(--bg2); border:1px solid var(--line); border-radius:8px; color:var(--ink); padding:11px; font-size:16px; font-family:inherit}
textarea{resize:vertical; min-height:56px}
input:focus,select:focus,textarea:focus{outline:none; border-color:var(--gold)}
.chip{display:inline-block; font-size:11.5px; font-weight:700; padding:3px 9px; border-radius:20px; letter-spacing:.3px; white-space:nowrap}
.chip.bench{background:#2c2c38; color:#c9c4b4; border:1px solid var(--line)}
.chip.ready{background:#3d2f10; color:var(--gold2); border:1px solid var(--gold)}
.chip.approved{background:var(--okbg); color:var(--ok); border:1px solid var(--ok)}
.chip.returned{background:var(--badbg); color:var(--bad); border:1px solid var(--bad)}
.chip.ordered{background:#23232e; color:#b9b3a4; border:1px dashed var(--dim2)}
.chip.kitting{background:#2e2140; color:#c9a7f5; border:1px solid #7a5fb0}
.chip.readybench{background:#12303a; color:#6fd3e7; border:1px solid #3d8fa5}
.chip.shipped{background:#1d2b1d; color:#9ccc65; border:1px solid #558b2f}
.badge{display:inline-block; background:var(--badbg); color:var(--bad); border:1px solid var(--bad); font-size:11px; font-weight:700; padding:2px 7px; border-radius:12px; margin-left:6px; vertical-align:1px}
.bagrow{display:flex; align-items:center; gap:11px; padding:9px 0; border-bottom:1px solid var(--line); font-size:14.5px}
.bagrow input{width:23px; height:23px; accent-color:var(--gold); flex:0 0 auto}
.bagrow label{flex:1; cursor:pointer}
.roles{flex-wrap:wrap}
.roles button{flex:1 1 30%}
.inst{display:flex; justify-content:space-between; align-items:center; gap:10px; padding:13px 14px; background:var(--card); border:1px solid var(--line); border-radius:var(--radius); margin-bottom:9px; cursor:pointer; text-align:left; width:100%; color:var(--ink)}
.inst:active{background:var(--card2)}
.inst .t1{font-weight:700; font-size:15.5px}
.inst .t2{color:var(--dim); font-size:12.5px; margin-top:1px}
.code{font-family:ui-monospace,Menlo,Consolas,monospace; color:var(--gold2); font-weight:700}
.mgrid{display:grid; grid-template-columns:1fr 1fr; gap:10px}
.mfield{background:var(--bg2); border:1px solid var(--line); border-radius:10px; padding:10px}
.mfield .ml{font-size:12px; color:var(--dim); font-weight:700; min-height:30px}
.mfield .tg{font-size:11.5px; color:var(--dim2); margin-top:3px}
.mfield input{margin-top:5px; text-align:center; font-size:18px; font-weight:700; padding:9px}
.mfield.ok{border-color:var(--ok)} .mfield.ok input{border-color:var(--ok); color:var(--ok)}
.mfield.bad{border-color:var(--bad)} .mfield.bad input{border-color:var(--bad); color:var(--bad)}
table.cmp{width:100%; border-collapse:collapse; font-size:13.5px; margin-top:8px}
table.cmp th,table.cmp td{border-bottom:1px solid var(--line); padding:7px 5px; text-align:right}
table.cmp th:first-child,table.cmp td:first-child{text-align:left}
table.cmp th{color:var(--dim); font-size:11.5px; text-transform:uppercase; letter-spacing:.4px}
.flag{color:var(--bad); font-weight:700}
.pass{color:var(--ok); font-weight:700}
.banner{border-radius:10px; padding:11px 13px; font-size:14px; margin-bottom:12px}
.banner.ret{background:var(--badbg); border:1px solid var(--bad); color:#f3c1bd}
.banner.info{background:#2c2c38; border:1px solid var(--line); color:var(--dim)}
.photos{display:flex; gap:8px; flex-wrap:wrap; margin-top:8px}
.photos img{width:74px; height:74px; object-fit:cover; border-radius:8px; border:1px solid var(--line)}
.stat{display:grid; grid-template-columns:1fr 1fr; gap:10px}
.stat .s{background:var(--bg2); border:1px solid var(--line); border-radius:10px; padding:12px; text-align:center}
.stat .n{font-size:26px; font-weight:800; color:var(--gold2)}
.stat .l{font-size:12px; color:var(--dim); margin-top:2px}
.asklog{background:var(--bg2); border:1px solid var(--line); border-radius:10px; padding:11px; font-size:14px; margin-top:10px; white-space:pre-wrap}
.asklog:empty{display:none}
.qrbox{display:flex; flex-direction:column; align-items:center; gap:8px; padding:14px; background:#fff; border-radius:10px; color:#111}
.qrbox .big{font-family:ui-monospace,Menlo,monospace; font-size:30px; font-weight:800; letter-spacing:2px; color:#111}
.qrbox .sm{font-size:12px; color:#444}
.switch{display:flex; align-items:center; gap:10px; margin-top:12px; font-size:14.5px}
.switch input{width:22px; height:22px; accent-color:var(--gold)}
.hist{font-size:12.5px; color:var(--dim); border-top:1px solid var(--line); margin-top:12px; padding-top:9px}
.hist div{margin:3px 0}
.foot{color:var(--dim2); font-size:12px; text-align:center; margin-top:22px; padding:0 16px}
.linkbtn{background:none; border:none; color:var(--dim); font-size:12.5px; text-decoration:underline; padding:4px}
#printArea{display:none}
@media print{
  @page{margin:6mm}
  body>*{display:none !important}
  body>#printArea{display:block !important; color:#000; background:#fff; padding:24px; font-family:Georgia,serif}
  body>#printArea .svclabel{margin:0}
}
.cert{border:2.5px solid #8a6d1f; padding:26px; max-width:680px; margin:0 auto; color:#111}
.cert h1{font-size:22px; text-align:center; margin:0; color:#8a6d1f; letter-spacing:1px}
.cert h2{font-size:14px; text-align:center; font-weight:normal; margin:4px 0 18px; color:#333}
.cert table{width:100%; border-collapse:collapse; font-size:13px; margin:12px 0}
.cert td,.cert th{border:1px solid #999; padding:5px 7px; text-align:right}
.cert td:first-child,.cert th:first-child{text-align:left}
.cert .meta{display:flex; justify-content:space-between; font-size:13.5px; margin:6px 0}
.cert .sig{display:flex; justify-content:space-between; margin-top:30px; font-size:13px}
.cert .sig div{border-top:1px solid #333; padding-top:5px; width:45%; text-align:center}
.labelprint{border:1.5px dashed #333; padding:18px; max-width:340px; margin:0 auto; text-align:center; color:#111; font-family:Arial,sans-serif}
.labelprint .big{font-family:monospace; font-size:32px; font-weight:800; letter-spacing:2px}
.btn.scan{background:#2c2110; color:var(--gold2); border:1.5px solid var(--gold)}
#scanner{position:fixed; inset:0; background:rgba(8,8,10,.97); z-index:200; display:none; flex-direction:column; align-items:center; padding:20px 16px; overflow:auto}
#scanner video{width:100%; max-width:420px; border-radius:12px; border:1.5px solid var(--gold); background:#000; margin-top:12px}
.kitpart{background:var(--bg2); border:1px solid var(--line); border-radius:10px; padding:10px; margin-top:8px}
.kitpart .kp-name{font-size:14px; font-weight:600; margin-bottom:6px}
.kitpart select{margin-bottom:6px}
.kp-row{display:flex; justify-content:space-between; gap:10px; padding:6px 0; border-bottom:1px solid var(--line); font-size:13.5px}
.kp-row:last-child{border-bottom:none}
/* ——— Classic internal service label (Scherl & Roth style), true size 90 × 38 mm ——— */
.svclabel{width:90mm; max-width:100%; height:38mm; margin:0 auto; background:#f6efdb; color:#1c1a14; font-family:Georgia,'Times New Roman',serif; border:1.5px solid #2a2519; padding:1.6mm; box-sizing:border-box}
.svc-in{position:relative; border:1px solid #2a2519; height:100%; padding:1.8mm 3mm; box-sizing:border-box; display:flex; flex-direction:column}
.svc-brand{text-align:center; font-size:13.5pt; letter-spacing:3px; font-weight:600; line-height:1.1}
.svc-year{position:absolute; top:1.8mm; right:3mm; font-style:italic; font-size:10pt}
.svc-mid{display:flex; justify-content:space-between; align-items:center; flex:1; gap:3mm}
.svc-model{font-size:10pt}
.svc-model u{font-weight:700}
.svc-right{display:flex; align-items:center; gap:2.5mm}
.svc-sn{background:#fff; border:1px solid #bbb; border-radius:2mm; padding:1mm 2.4mm; font-family:Arial,sans-serif; font-weight:700; font-size:10.5pt; white-space:nowrap}
.svc-qr{text-align:center}
.svc-qr svg{display:block; margin:0 auto}
.svc-code{font-family:ui-monospace,Menlo,monospace; font-size:6.5pt; font-weight:700; letter-spacing:.5px; margin-top:.5mm}
.svc-bottom{text-align:center; font-size:8.5pt; letter-spacing:2.5px}
</style>
</head>

var scanStream = null, scanRAF = null;
function startScan(){
  var ov = document.getElementById('scanner');
  if(!ov){
    ov = document.createElement('div'); ov.id = 'scanner';
    ov.innerHTML = '<div style="color:var(--gold2);font-weight:700;font-size:17px;margin:8px 0 4px">📷 Scan the internal label</div>'+
      '<div class="sub" style="text-align:center;max-width:340px">Point the camera at the label QR — through the f-hole, or on the hang tag. The code opens the instrument record.</div>'+
      '<video id="scanVideo" playsinline muted></video><canvas id="scanCanvas" style="display:none"></canvas>'+
      '<div id="scanMsg" class="sub" style="margin-top:10px;text-align:center;max-width:340px"></div>'+
      '<button class="btn dark" id="scanClose" style="max-width:340px;margin-top:14px">Cancel</button>';
    document.body.appendChild(ov);
    ov.querySelector('#scanClose').onclick = stopScan;
  }
  ov.style.display = 'flex';
  var msg = ov.querySelector('#scanMsg'); msg.textContent = 'Opening camera…';
  if(!navigator.mediaDevices || !navigator.mediaDevices.getUserMedia || typeof jsQR === 'undefined'){
    msg.textContent = 'Camera scanning is not available here (it needs HTTPS and camera permission). No problem — use the search box to find the instrument by its code (QC-…) or serial.';
    return;
  }
  navigator.mediaDevices.getUserMedia({video:{facingMode:'environment'}}).then(function(stream){
    scanStream = stream;
    var v = ov.querySelector('#scanVideo'); v.srcObject = stream; v.play();
    msg.textContent = 'Looking for a code…';
    var cv = ov.querySelector('#scanCanvas'), ctx = cv.getContext('2d');
    var tick = function(){
      if(!scanStream) return;
      if(v.readyState === v.HAVE_ENOUGH_DATA && v.videoWidth){
        cv.width = v.videoWidth; cv.height = v.videoHeight;
        ctx.drawImage(v, 0, 0, cv.width, cv.height);
        try{
          var img = ctx.getImageData(0, 0, cv.width, cv.height);
          var res = jsQR(img.data, img.width, img.height);
          if(res && res.data){
            var code = res.data.trim().toUpperCase();
            var hit = state.instruments.find(function(x){ return x.code.toUpperCase() === code || String(x.serial).toUpperCase() === code; });
            if(hit){ stopScan(); openInstrument(hit.id); toast('Opened '+hit.code+' — serial '+hit.serial); return; }
            msg.textContent = 'Read "'+res.data+'" — no instrument with that code on this device. Type it in the search box to double-check.';
          }
        }catch(e){}
      }
      scanRAF = requestAnimationFrame(tick);
    };
    tick();
  }).catch(function(){
    msg.textContent = 'Camera permission was denied, or no camera is available. No problem — use the search box to find the instrument by its code (QC-…) or serial.';
  });
}
function stopScan(){
  if(scanRAF) cancelAnimationFrame(scanRAF); scanRAF = null;
  if(scanStream){ scanStream.getTracks().forEach(function(tr){ tr.stop(); }); scanStream = null; }
  var ov = document.getElementById('scanner'); if(ov) ov.style.display = 'none';
}

function handlePhotos(ev, i){
  var files = Array.prototype.slice.call(ev.target.files||[]).slice(0,4);
  files.forEach(function(f){
    var rd = new FileReader();
    rd.onload = function(){
      var img = new Image();
      img.onload = function(){
        var max = 640, sc = Math.min(1, max/Math.max(img.width,img.height));
        var cv = document.createElement('canvas'); cv.width = Math.round(img.width*sc); cv.height = Math.round(img.height*sc);
        cv.getContext('2d').drawImage(img,0,0,cv.width,cv.height);
        i.luthier.photos = (i.luthier.photos||[]).concat([cv.toDataURL('image/jpeg',0.62)]).slice(-4);
        save(); renderLuthierForm(i);
      };
      img.src = rd.result;
    };
    rd.readAsDataURL(f);
  });
}

function renderCompare(i){

  h += '<div class="card"><h2>'+esc(t.model)+' · <span class="code">'+i.code+'</span> '+chip(i.status)+'</h2>'+

    h += '<div class="sub">Checked by '+esc(i.qc.name)+' · '+fmtDate(i.qc.at)+'</div>';
    h += '<table class="cmp"><tr><th>Measurement</th><th>Target</th><th>Luthier</th><th>QC</th><th>Diff</th><th></th></tr>';

      var lv = i.luthier.measures[m.key], qv = i.qc.measures[m.key];
      var d = (lv!=null&&qv!=null) ? Math.round(Math.abs(lv-qv)*100)/100 : null;
      var flag = (d!=null && d>0.2) || inRange(t.targets[m.key], qv)!==true;
      h += '<tr><td>'+m.label+'</td><td>'+targetText(t.targets[m.key]).replace('Target ','')+'</td><td>'+(lv==null?'—':lv)+'</td><td>'+(qv==null?'—':qv)+'</td><td>'+(d==null?'—':d.toFixed(2))+'</td><td class="'+(flag?'flag':'pass')+'">'+(flag?'⚠ FLAG':'✓')+'</td></tr>';
    });
    h += '</table><div class="sub mt">Flags: difference over 0.2 mm between the two measurements, or the QC value outside spec.</div>';
    if(i.qc.decision==='returned') h += '<div class="banner ret mt"><strong>Returned:</strong> '+esc(i.qc.reason)+'</div>';
    if(i.qc.decision==='approved') h += '<div class="banner info mt" style="border-color:var(--ok);color:var(--ok)">✓ Approved — QC certificate issued.</div><button class="btn" id="certBtn">🖨️ Print QC Certificate</button>' + (i.status==='shipped' ? '<div class="banner info mt">📦 Shipped'+(i.orderId?' — order '+i.orderId:'')+'. This record is closed.</div>' : (state.role==='manager' ? '<button class="btn dark mt" id="shipBtn">📦 Mark as shipped</button>' : ''));

      '<div class="row mt"><button class="btn" id="qc-approve">✓ Approve</button><button class="btn danger" id="qc-return">Return for rework</button></div>';
  }
  h += historyHTML(i) + '</div>';
  if(i.parts && i.parts.length){
    h += '<div class="card"><h3>Parts kit</h3>'+
      ((i.kitIncomplete && i.kitIncomplete.flag) ? '<div class="banner ret">⚠ Kit flagged incomplete at intake'+(i.kitIncomplete.note?': '+esc(i.kitIncomplete.note):'')+'</div>' : '')+
      i.parts.map(function(p){
        return '<div class="kp-row"><span>'+(p.state==='installed'?'✅':p.state==='substituted'?'🔁':'⏳')+' '+esc(p.name)+'</span><span class="sub">'+p.state+(p.state==='substituted'&&p.note?' → '+esc(p.note):'')+'</span></div>';
      }).join('')+'</div>';
  }
  if(i.luthier.photos && i.luthier.photos.length) h += '<div class="card"><h3>Photos</h3><div class="photos">'+i.luthier.photos.map(function(p){return '<img src="'+p+'">';}).join('')+'</div></div>';
  app.innerHTML = h;
  wireBack();
  var cb = document.getElementById('certBtn'); if(cb) cb.onclick = function(){ printHTML(certHTML(i)); };
  var shb = document.getElementById('shipBtn'); if(shb) shb.onclick = function(){ i.status='shipped'; i.history.push(['Marked shipped by the manager'+(i.orderId?' — order '+i.orderId:''), new Date().toISOString()]); save(); render(); toast('Shipped. Order progress updated.'); };
  if(canDecide){
    document.getElementById('qc-approve').onclick = function(){
      i.qc.decision='approved'; i.qc.pending=false; i.status='approved';
      i.history.push(['QC approved by '+i.qc.name, new Date().toISOString()]); save(); render();
      toast('Approved. Certificate is ready to print.');
    };
    document.getElementById('qc-return').onclick = function(){
      var r = document.getElementById('qc-reason').value.trim();
      if(!r){ toast('A return needs a written reason — the luthier must know what to fix.'); return; }
      i.qc.decision='returned'; i.qc.pending=false; i.qc.reason=r; i.status='returned';
      i.history.push(['QC returned by '+i.qc.name+': '+r, new Date().toISOString()]); save();
      ui.mode=null; ui.compareId=null; state.role='qc'; render();
      toast('Returned to the bench with your note.');
    };
  }

  app.querySelectorAll('[data-open]').forEach(function(b){ b.onclick = function(){ openInstrument(b.dataset.open); }; });
}
function ensureBag(i){
  if(i.bagItems && i.bagItems.length) return i.bagItems;
  var t = tpl(i.templateId); var o = i.orderId ? orderById(i.orderId) : null;
  var line = o && o.lines ? o.lines[i.orderLine||0] : null;
  i.bagItems = bagFor(t, line); return i.bagItems;
}
function renderKit(i){
  if(!i){ ui.mode=null; return render(); }
  var t = tpl(i.templateId); var bag = ensureBag(i);
  var h = backBtn() + '<div class="card"><h2>Bag the kit · '+esc(t.model)+' · <span class="code">'+(i.code||'')+'</span></h2>'+
    '<div class="sub">Serial '+dispSerial(i)+(i.orderId?' · Order '+i.orderId:'')+' · '+esc(t.name)+'</div>'+
    '<div class="sub mt">Tick each item as it goes into the bag for THIS instrument.</div>';
  bag.forEach(function(b, idx){
    h += '<div class="bagrow"><input type="checkbox" id="bag-'+idx+'"'+(b.bagged?' checked':'')+'><label for="bag-'+idx+'">'+esc(b.name)+'</label></div>';
  });
  h += '<label class="switch"><input type="checkbox" id="kit-short" '+((i.shortage&&i.shortage.flag)?'checked':'')+'> ⚠ Flag shortage — something is missing from the shelf</label>'+
    '<input type="text" id="kit-short-note" value="'+esc(i.shortage?i.shortage.note:'')+'" placeholder="What is missing? (the manager sees this)"></div>'+
    '<div class="card"><button class="btn" id="kit-done">Bag complete — Ready for Bench 🎻</button>'+
    '<div class="sub mt">Enabled when every item is bagged — or when a shortage is flagged, so work is never silently blocked.</div>'+
    historyHTML(i)+'</div>';
  app.innerHTML = h; wireBack();
  var paint = function(){
    var all = bag.every(function(b, idx){ var el = document.getElementById('bag-'+idx); return el && el.checked; });
    var fl = document.getElementById('kit-short').checked;
    document.getElementById('kit-done').disabled = !(all || fl);
  };
  bag.forEach(function(b, idx){ document.getElementById('bag-'+idx).addEventListener('change', paint); });
  document.getElementById('kit-short').addEventListener('change', paint);
  paint();
  document.getElementById('kit-done').onclick = function(){
    bag.forEach(function(b, idx){ b.bagged = document.getElementById('bag-'+idx).checked; });
    i.shortage = {flag: document.getElementById('kit-short').checked, note: document.getElementById('kit-short-note').value.trim()};
    i.status = 'ready_bench';
    i.history.push(['Kit bagged by José'+(i.shortage.flag ? ' — SHORTAGE flagged: '+(i.shortage.note||'unspecified') : ' — complete'), new Date().toISOString()]);
    save(); ui.mode=null; ui.detailId=null; render();
    toast('Bag complete. The luthier sees it under Ready for Bench.');
  };
}
function orderLineRow(){
  return '<div class="om-line" style="border-top:1px solid var(--line); padding-top:2px; margin-top:10px">'+
    '<label class="fl">Template (model + spec)</label><select class="om-tpl">'+state.templates.map(function(t){return '<option value="'+t.id+'">'+esc(t.name)+'</option>';}).join('')+'</select>'+
    '<div class="row"><div><label class="fl">Qty</label><input type="number" class="om-qty" value="1" min="1"></div>'+
    '<div><label class="fl">Strings</label><input type="text" class="om-str" placeholder="e.g. Thomastik Dominant set"></div></div>'+
    '<label class="fl">Accessories</label><input type="text" class="om-acc" placeholder="e.g. Wittner tailpiece · Despiau bridge blank"></div>';
}
function orderProgressHTML(o){
  var items = state.instruments.filter(function(i){return i.orderId===o.id;});
  var stages = ['ordered','kitting','ready_bench','at_bench','ready','approved','returned','shipped'];
  var counts = {}; items.forEach(function(i){ counts[i.status]=(counts[i.status]||0)+1; });
  var shipped = counts.shipped||0;
  var pct = items.length ? Math.round(100*shipped/items.length) : 0;
  var shorts = items.filter(function(i){return i.shortage && i.shortage.flag;});
  var stageTxt = stages.filter(function(st){return counts[st];}).map(function(st){return counts[st]+' '+statuses[st];}).join(' · ');
  return '<div class="card"><h3>'+esc(o.id)+' · '+esc(o.client)+'</h3>'+
    '<div class="sub">Due '+esc(o.dueDate||'—')+(o.notes?' · '+esc(o.notes):'')+'</div>'+
    '<div class="sub mt">'+items.length+' instrument(s): '+(stageTxt||'none yet')+'</div>'+
    '<div style="background:var(--bg2);border:1px solid var(--line);border-radius:8px;height:12px;margin-top:8px;overflow:hidden"><div style="background:var(--ok);height:100%;width:'+pct+'%"></div></div>'+
    '<div class="sub mt">'+pct+'% shipped ('+shipped+'/'+items.length+')</div>'+
    (shorts.length ? '<div class="banner ret mt">⚠ Shortage exceptions ('+shorts.length+'): '+shorts.map(function(i){return (i.code||i.serial||'unassigned')+' — '+esc(i.shortage.note||'unspecified');}).join('; ')+'</div>' : '')+
    '</div>';
}
function createOrder(){
  var client = document.getElementById('om-client').value.trim() || 'Client';
  var due = document.getElementById('om-due').value;
  var notes = document.getElementById('om-notes').value.trim();
  var lines = []; var bad = false;
  app.querySelectorAll('.om-line').forEach(function(r){
    var qty = parseInt(r.querySelector('.om-qty').value, 10) || 0;
    if(qty < 1) bad = true;
    lines.push({templateId: r.querySelector('.om-tpl').value, qty: qty,
      strings: r.querySelector('.om-str').value.trim(), accessories: r.querySelector('.om-acc').value.trim()});
  });
  if(bad || !lines.length){ toast('Each order line needs a quantity of at least 1.'); return; }
  var o = {id: nextOrderId(), client: client, dueDate: due, notes: notes, createdAt: new Date().toISOString(), lines: lines};
  state.orders = state.orders || []; state.orders.push(o);
  lines.forEach(function(line, li){
    var t = tpl(line.templateId);
    for(var k = 0; k < line.qty; k++){
      state.instruments.unshift({id: uid(), code: null, serial: '', templateId: t.id, brand: t.brand||'', status: 'ordered',
        orderId: o.id, orderLine: li, createdAt: new Date().toISOString(),
        parts: tplParts(t), kitIncomplete: {flag:false, note:''}, shortage: {flag:false, note:''}, bagItems: bagFor(t, line),
        luthier: {name:'', measures: mkMeasures(null), newBridge:false, subs:'', photos:[], submittedAt:null}, qc: null,
        history: [['Order '+o.id+' received — '+client, new Date().toISOString()]]});
    }
  });
  save(); render();
  toast('Order '+o.id+' created — Prep (John) has it in his queue.');
}

/* ============ Manager: dashboard + Ask your data ============ */
function renderManager(){
  var list = state.instruments;
  var by = {ordered:0, kitting:0, ready_bench:0, at_bench:0, ready:0, approved:0, returned:0, shipped:0};
  list.forEach(function(i){ by[i.status]++; });
  var decided = list.filter(function(i){ return i.qc && (i.qc.decision==='approved'||i.qc.decision==='returned'); });
  var firstPass = decided.filter(function(i){
    return i.qc.decision==='approved' && !i.history.some(function(h){return /returned/i.test(h[0]);});
  }).length;
  var fpPct = decided.length ? Math.round(100*firstPass/decided.length) : null;
  var h = '<div class="card"><h2>Workshop dashboard</h2><div class="sub">Live from the bench records — no phone calls, no paper hunt.</div>'+
   '<div class="stat mt"><div class="s"><div class="n">'+by.at_bench+'</div><div class="l">At bench</div></div>'+
   '<div class="s"><div class="n">'+by.ready+'</div><div class="l">Ready for QC</div></div>'+
   '<div class="s"><div class="n">'+by.approved+'</div><div class="l">Approved</div></div>'+
   '<div class="s"><div class="n">'+(fpPct==null?'—':fpPct+'%')+'</div><div class="l">First-pass approval</div></div></div>'+
   '<div class="stat"><div class="s"><div class="n">'+by.ordered+'</div><div class="l">Ordered</div></div>'+
   '<div class="s"><div class="n">'+by.kitting+'</div><div class="l">Kitting</div></div>'+
   '<div class="s"><div class="n">'+by.ready_bench+'</div><div class="l">Ready for bench</div></div>'+
   '<div class="s"><div class="n">'+by.shipped+'</div><div class="l">Shipped</div></div></div>'+
   (by.returned? '<div class="banner ret mt">'+by.returned+' instrument(s) returned for rework — see the list below.</div>':'')+'</div>';
  h += '<div class="card"><h2>Ask your data</h2><div class="sub">Plain-language questions, answered honestly from the records on this device (demo engine — on the production version this layer runs on local Ollama inside your building). Try: “How many are ready for QC?” · “Which instruments were returned and why?” · “Who serviced the most?” · “How many Sweetwater?”</div>'+
   '<div class="row mt"><input type="text" id="ask-q" placeholder="Ask about your instruments…"><button class="btn sm" id="ask-btn" style="flex:0 0 84px">Ask</button></div>'+
   '<div class="asklog" id="ask-log"></div></div>';
  h += '<div class="card"><h2>📦 Client orders</h2><div class="sub">An order is where the chain starts: the client document says which instruments, which strings, which accessories. Creating one generates the instrument records — Prep (John) picks them up from there.</div>'+
   '<label class="fl">Client</label><input type="text" id="om-client" placeholder="e.g. Sweetwater">'+
   '<div class="row"><div><label class="fl">Due date</label><input type="date" id="om-due"></div>'+
   '<div><label class="fl">Notes</label><input type="text" id="om-notes" placeholder="e.g. Friday shipment"></div></div>'+
   '<div id="om-lines">'+orderLineRow()+'</div>'+
   '<button class="btn dark sm mt" id="om-addline">+ Add another line</button>'+
   '<button class="btn mt" id="om-create">Create order — send to Prep</button></div>';
  h += (state.orders||[]).map(orderProgressHTML).join('');
  h += '<div class="sub mb">All instruments (tap to view):</div><input type="text" id="listSearch" placeholder="🔎 Find by code (QC-…) or serial" style="margin-bottom:12px">' + (list.length? list.map(instButton).join('') : '<div class="banner info">No instruments yet.</div>');
  app.innerHTML = h;
  wireListTools();
  app.querySelectorAll('[data-open]').forEach(function(b){ b.onclick=function(){ ui.detailId=b.dataset.open; ui.mode='luthier'; render(); }; });
  var addBtn = document.getElementById('om-addline');
  if(addBtn) addBtn.onclick = function(){ document.getElementById('om-lines').insertAdjacentHTML('beforeend', orderLineRow()); };
  var createBtn = document.getElementById('om-create');
  if(createBtn) createBtn.onclick = createOrder;
  var run = function(){ var q=document.getElementById('ask-q').value; document.getElementById('ask-log').textContent = answerQuery(q); };
  document.getElementById('ask-btn').onclick = run;
  document.getElementById('ask-q').addEventListener('keydown', function(e){ if(e.key==='Enter') run(); });
}
function answerQuery(qRaw){
  var q = (qRaw||'').toLowerCase(); var list = state.instruments;
  if(!q.trim()) return 'Ask me something like “How many are ready for QC?” or “Which were returned and why?”';
  var count = function(st){ return list.filter(function(i){return i.status===st;}).length; };
  var names = function(arr){ return arr.map(function(i){return (i.code||'no code yet')+' (serial '+(i.serial||'pending')+')';}).join(', '); };
  // orders: what is left / progress
  var ordMatch = /ord-(\d+)/i.exec(qRaw||'');
  if(ordMatch || /\border(s)?\b/.test(q)){
    var oid = ordMatch ? ('ORD-'+ordMatch[1]) : null;
    var o = oid ? orderById(oid) : null;
    if(oid && !o) return 'I do not see an order '+oid+' on this device. Orders here: '+((state.orders||[]).map(function(x){return x.id;}).join(', ')||'none')+'.';
    var scope = o ? list.filter(function(i){return i.orderId===o.id;}) : list.filter(function(i){return i.orderId;});
    if(!scope.length) return o ? ('Order '+o.id+' has no instruments yet.') : 'No client orders on this device yet.';
    var per = {}; scope.forEach(function(i){ per[i.status]=(per[i.status]||0)+1; });
    var breakdown = Object.keys(per).map(function(st){return per[st]+' '+statuses[st].toLowerCase();}).join(', ');
    var left = scope.filter(function(i){return i.status!=='shipped';});
    return (o ? 'Order '+o.id+' ('+o.client+', due '+(o.dueDate||'—')+'): ' : 'Across all orders: ')+scope.length+' instrument(s) — '+breakdown+'.\nStill in the building (not shipped): '+left.length+(left.length ? ':\n'+left.map(function(i){return '· '+names([i])+' — '+statuses[i.status];}).join('\n') : '.');
  }
  // shortages flagged by Kitting (or at intake)
  if(/shortage|missing|incomplete/.test(q)){
    var sh = list.filter(function(i){ return (i.shortage&&i.shortage.flag) || (i.kitIncomplete&&i.kitIncomplete.flag); });
    if(!sh.length) return 'No shortages flagged anywhere. Every kit that reached the bench was complete.';
    return 'Shortage exceptions ('+sh.length+'):\n'+sh.map(function(i){
      var note = (i.shortage&&i.shortage.flag) ? i.shortage.note : i.kitIncomplete.note;
      return '· '+names([i])+' — '+statuses[i.status]+' — '+(note||'unspecified');
    }).join('\n');
  }
  // waiting on kitting / prep
  if(/kitting|bagging|bagged|prep/.test(q)){
    var ow = list.filter(function(i){return i.status==='ordered';});
    var kw = list.filter(function(i){return i.status==='kitting';});
    return 'Waiting on Kitting:\n· Still in Prep, labels not ready ('+ow.length+'): '+(ow.length?names(ow):'none')+'.\n· Being bagged by José ('+kw.length+'): '+(kw.length?names(kw):'none')+'.';
  }
  // per-technician
  if(/who|technician|luthier|serviced|workload|most/.test(q)){
    var per = {}; list.forEach(function(i){ if(i.luthier&&i.luthier.name) per[i.luthier.name]=(per[i.luthier.name]||0)+1; });
    var keys = Object.keys(per);
    if(!keys.length) return 'No serviced instruments on record yet.';
    return 'Instruments serviced per technician:\n' + keys.map(function(k){return '· '+k+': '+per[k];}).join('\n');
  }
  // returned & why
  if(/return|rework|reject|fail|why/.test(q)){
    var ret = list.filter(function(i){return i.status==='returned';});
    if(!ret.length) return 'Nothing is currently returned for rework. Every inspected instrument passed.';
    return 'Returned for rework ('+ret.length+'):\n' + ret.map(function(i){return '· '+names([i])+' — '+(i.qc?i.qc.reason:'');}).join('\n');
  }
  // by client / template
  var clientHit = state.templates.find(function(t){ return q.indexOf(t.client.toLowerCase())>=0; });
  if(clientHit || /client|standard/.test(q)){
    var t2 = clientHit || state.templates.find(function(t){return /standard/.test(q)&&t.client==='Standard';}) || state.templates[0];
    var arr = list.filter(function(i){return i.templateId===t2.id;});
    return arr.length+' instrument(s) under '+t2.name+': '+(arr.length?names(arr):'none')+'.';
  }
  // holding / waiting / bottleneck
  if(/hold|wait|bottleneck|shipment|stuck|pending/.test(q)){
    var r = list.filter(function(i){return i.status==='ready';});
    var b = list.filter(function(i){return i.status==='at_bench';});
    return 'Waiting on QC ('+r.length+'): '+(r.length?names(r):'none')+'.\nStill at the bench ('+b.length+'): '+(b.length?names(b):'none')+'.';
  }
  // counts by status
  var stMap = [['approved','approved'],['ready','ready'],['returned','returned'],['bench','at_bench'],['progress','at_bench']];
  for(var s=0;s<stMap.length;s++){ if(q.indexOf(stMap[s][0])>=0){ var arr2=list.filter(function(i){return i.status===stMap[s][1];}); return 'There are '+arr2.length+' instrument(s) '+statuses[stMap[s][1]].toLowerCase()+': '+(arr2.length?names(arr2):'none')+'.'; } }
  if(/how many|count|total|instruments/.test(q)){
    return 'Total instruments: '+list.length+' — '+count('ordered')+' ordered, '+count('kitting')+' in kitting, '+count('ready_bench')+' ready for bench, '+count('at_bench')+' at bench, '+count('ready')+' ready for QC, '+count('approved')+' approved, '+count('returned')+' returned, '+count('shipped')+' shipped.';
  }
  return 'Here is the current picture: '+list.length+' instruments — '+count('ordered')+' ordered, '+count('kitting')+' in kitting, '+count('ready_bench')+' ready for bench, '+count('at_bench')+' at bench, '+count('ready')+' ready for QC, '+count('approved')+' approved, '+count('returned')+' returned, '+count('shipped')+' shipped.\nYou can also ask: “How many are left in ORD-1042?”, “What is waiting on kitting?”, “Any shortages?”, “Which were returned and why?”, “Who serviced the most?”';
}

/* ============ Templates (editable) ============ */
function renderTemplates(){
  var h = '<div class="card"><h2>Spec templates</h2><div class="sub">Inspection targets per model + client, in mm — these six QC-card measurements are the only approval criteria. Point targets (min = max) accept ±0.1 mm. Changes save on this device and apply to validation immediately.</div></div>';
  state.templates.forEach(function(t){
    h += '<div class="card"><h3>'+esc(t.name)+'</h3><div class="sub">Model '+esc(t.model)+' · '+esc(t.size||'')+' · Client '+esc(t.client)+' · Brand '+esc(t.brand||'')+'</div>'+
      MEASURES.map(function(m){
        return '<div class="row" style="align-items:end;margin-top:8px"><div style="flex:1.6"><label class="fl" style="margin:0">'+m.label+'</label></div>'+
        '<div><input type="number" step="0.1" id="tp-'+t.id+'-'+m.key+'-min" value="'+t.targets[m.key][0]+'"></div>'+
        '<div><input type="number" step="0.1" id="tp-'+t.id+'-'+m.key+'-max" value="'+t.targets[m.key][1]+'"></div></div>';
      }).join('')+
      '<div class="sub" style="margin-top:4px">Columns: min / max</div>'+
      (t.ref ? '<div class="sub" style="margin-top:6px">Reference only — not inspection criteria (Revelle/Strobel standards table, 2023-07-21): fingerboard scoop, treble side '+pairText(t.ref.scoopT)+' · bass side '+pairText(t.ref.scoopB)+' · bridge width at feet '+pairText(t.ref.width)+'.</div>' : '')+
      '<label class="fl">Parts kit — one part per line (copied to every new instrument at intake)</label>'+
      '<textarea id="tp-'+t.id+'-kit">'+(t.kit||[]).map(esc).join('\n')+'</textarea>'+
      '<button class="btn mt" data-savetpl="'+t.id+'">Save template</button></div>';
  });
  app.innerHTML = h;
  app.querySelectorAll('[data-savetpl]').forEach(function(b){ b.onclick = function(){
    var t = tpl(b.dataset.savetpl);
    MEASURES.forEach(function(m){
      var mn = parseFloat(document.getElementById('tp-'+t.id+'-'+m.key+'-min').value);
      var mx = parseFloat(document.getElementById('tp-'+t.id+'-'+m.key+'-max').value);
      if(!isNaN(mn)&&!isNaN(mx)) t.targets[m.key] = [Math.min(mn,mx), Math.max(mn,mx)];
    });
    var kitEl = document.getElementById('tp-'+t.id+'-kit');
    if(kitEl) t.kit = kitEl.value.split('\n').map(function(s){return s.trim();}).filter(Boolean);
    save(); toast('Template saved: '+t.name);
  };});
}

/* ============ Init ============ */
load(); state.view = state.view||'work'; if(!state.orders) state.orders = [];
document.querySelectorAll('#roles button').forEach(function(b){ b.onclick=function(){ state.role=b.dataset.role; ui.mode=null; ui.detailId=null; ui.compareId=null; state.view='work'; save(); render(); }; });
document.getElementById('tab-work').onclick = function(){ state.view='work'; save(); render(); };
document.getElementById('tab-templates').onclick = function(){ state.view='templates'; save(); render(); };
document.getElementById('resetDemo').onclick = function(){ if(confirm('Reset all SetupQC demo data on this device?')){ localStorage.removeItem(LS_KEY); state = seedState(); ui.mode=null; ui.detailId=null; save(); render(); } };
render();
